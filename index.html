<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eeeade">
  <title>Tap Away</title>
  <link rel="stylesheet" href="style.css?v=0.1.7">
</head>
<body>
  <main>
    <header><div><h1>TAP AWAY</h1><span>PHASE 1 · v0.1.7</span></div><div class="controls"><span id="points"></span><button id="notes" type="button">更新情報</button><button id="dev-reset" type="button">DEV RESET</button><button id="sound" type="button" aria-pressed="false">Sound OFF</button></div></header>
    <canvas id="map" aria-label="土地をタップして開拓する立体地図。スワイプで移動、ピンチで拡大縮小。"></canvas>
    <footer><span id="notice" role="status"></span></footer>
    <section id="start-screen"><h2>TAP AWAY</h2><p>考え事や音楽のお供に、<br>気の向くままにポチポチ。</p><button id="start" type="button">はじめる</button></section>
    <dialog id="release-dialog"><button id="close-notes" type="button">閉じる</button><h2>更新情報</h2><div id="release-body"></div></dialog>
    <noscript>このゲームにはJavaScriptが必要です。</noscript>
  </main>
  <script src="world.js?v=0.1.7"></script>
  <script src="app.js?v=0.1.7"></script>
</body>
</html>
