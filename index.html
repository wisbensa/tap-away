<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eeeade">
  <title>Tap Away · Touch Prototype</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header><div><h1>TAP AWAY</h1><span>TOUCH PROTOTYPE / PHASE 0</span></div><button id="sound" type="button" aria-pressed="false">Sound OFF</button></header>
    <canvas id="map" aria-label="触感を試す立体地図。タップで地面が反応します。ドラッグで移動、ピンチまたはホイールで拡大縮小。"></canvas>
    <footer><p>気の向くままに、ポチポチ。</p><span>タップで触れる · ドラッグで移動 · ピンチ / ホイールで拡大縮小</span><span id="notice" role="status"></span></footer>
    <noscript>このプロトタイプにはJavaScriptが必要です。</noscript>
  </main>
  <script src="app.js"></script>
</body>
</html>
