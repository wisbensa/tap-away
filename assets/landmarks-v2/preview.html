<!doctype html>
<html lang="ja">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  /><title>ランドマーク素材 v2</title
  ><style>
    body {
      font-family: system-ui;
      margin: 24px;
      background: #e6e1d5;
      color: #242b27;
    }
    h1 {
      font-size: 22px;
    }
    button,
    input {
      margin: 8px;
      padding: 10px;
    }
    main {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }
    figure {
      margin: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--bg, #25332d);
      border-radius: 8px;
    }
    img {
      width: var(--size, 220px);
      max-width: 100%;
      height: 280px;
      object-fit: contain;
    }
    figcaption {
      margin-top: 10px;
      color: var(--fg, #eee8d7);
    }
  </style>
  <h1>ランドマーク素材 v2 — 7種</h1>
  <p>参照画像2の2・3・5・6・7・8・9。ゲーム内への組込みは未実施。</p>
  <button
    onclick="document.documentElement.style.setProperty('--bg','#25332d');document.documentElement.style.setProperty('--fg','#eee8d7')"
  >
    暗い背景</button
  ><button
    onclick="document.documentElement.style.setProperty('--bg','#e8e3d8');document.documentElement.style.setProperty('--fg','#242b27')"
  >
    明るい背景</button
  ><label
    >表示幅
    <input
      type="range"
      min="64"
      max="280"
      value="220"
      oninput="document.documentElement.style.setProperty('--size',this.value+'px');document.querySelectorAll('img').forEach(e=>e.style.height=this.value+'px')"
  /></label>
  <main>
    <figure>
      <img src="02-doll-keeper.png" alt="人形を抱く大きな子" />
      <figcaption>2：人形を抱く大きな子</figcaption>
    </figure>
    <figure>
      <img src="03-ball-chasers.png" alt="球を追う三人" />
      <figcaption>3：球を追う三人</figcaption>
    </figure>
    <figure>
      <img src="05-couple-under-trees.png" alt="木陰のふたり" />
      <figcaption>5：木陰のふたり</figcaption>
    </figure>
    <figure>
      <img src="06-child-on-rock.png" alt="岩上の子" />
      <figcaption>6：岩上の子</figcaption>
    </figure>
    <figure>
      <img src="07-guard-in-wooden-frame.png" alt="木枠の番人" />
      <figcaption>7：木枠の番人</figcaption>
    </figure>
    <figure>
      <img src="08-piper-and-birds.png" alt="鳥たちの笛吹き" />
      <figcaption>8：鳥たちの笛吹き</figcaption>
    </figure>
    <figure>
      <img src="09-elder-with-black-dog.png" alt="黒犬と杖の老人" />
      <figcaption>9：黒犬と杖の老人</figcaption>
    </figure>
  </main>
</html>
